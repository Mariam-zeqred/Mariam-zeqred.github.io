name: Sync projects from GitHub
# Every day after the portfolio release (07:00 UTC), refresh data/repos.js so the site shows
# exactly the repositories that are public, with their README intro, topics and chapter counts.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh data/repos.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_repos.py
      - name: Commit if changed
        run: |
          git config user.name "site-sync"
          git config user.email "site-sync@users.noreply.github.com"
          git add data/repos.js
          git diff --cached --quiet || (git commit -m "Sync projects from GitHub ($(date -u +%Y-%m-%d))" && git push)
